# Deluge: a torrent client, one container (LinuxServer.io's image: the
# daemon and its web UI under s6). What it downloads goes into a shared
# folder, which the media players on the same server read as a library
# (SPEC.md §8.1, "A service's folder as a library"). The web UI's password
# is "deluge" until the install hook below replaces it with one Roostack
# made, shown on Deluge's page.
# Image digest looked up 2026-11-16.
schema: roostack/v1alpha1
name: deluge
title: Deluge
description: Downloads torrents into a folder your media players can read
version: 2.2.0-roostack.1

about:
  maker: the Deluge team, volunteers
  website: https://deluge-torrent.org
  source: https://git.deluge-torrent.org/deluge
  licence: GPL-3.0-or-later
  icon: icon.png
  categories: [media]
  keywords: [torrent, bittorrent, downloads, download client]
built_with: [python, libtorrent]
requires:
  roostack: "0.1.8"

settings:
  - key: web_password
    title: Web UI password
    description: Deluge asks for it when you open it.
    type: secret
    generate: true               # Roostack creates it; stored as a Podman secret
    reveal: true                 # shown on Deluge's page, to sign in

containers:
  app:
    # No UserNS=keep-id: the image's init (s6) must start as the
    # container's root and switch to its abc user (1000 inside). Its files
    # belong to one of Roostack's sub-UIDs, readable by others (UMASK
    # 022), so the media players reading its downloads can read them.
    image: ghcr.io/linuxserver/deluge:2.2.0-ls387@sha256:e2a537991884a514b64d7adf857e39b5e9239a1c76e52114e52bf10707dde772
    env:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      TZ: "{{ .Lab.TimeZone }}"
      DELUGE_LOGLEVEL: error
    mounts:
      - { storage: config, path: /config }
      - { storage: downloads, path: /downloads }
    health:
      http: { port: 8112, path: / }
    memory: 300 MB

storage:
  config:
    title: Settings, and the torrents it's working on
    class: critical
  downloads:
    title: Downloads
    class: replaceable           # not backed up: they can be downloaded again
    location: media              # beside the media, which can be a disk of its own
    shared: true                 # a library the media players here read

hooks:
  # The web UI's password: from Deluge's default to the one Roostack made,
  # through Deluge's own API, and the web UI told to connect to its daemon
  # by itself. Safe to re-run: once the new password works, done.
  - on: install
    container: app
    secrets:
      WEB_PASSWORD: web_password
    command:
      - python3
      - -c
      - |
        import http.cookiejar, json, os, sys, urllib.request
        url = "http://127.0.0.1:8112/json"
        op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
        n = 0
        def call(method, *params):
            global n
            n += 1
            req = urllib.request.Request(url, json.dumps({"method": method, "params": list(params), "id": n}).encode(),
                                         {"Content-Type": "application/json"})
            try:
                reply = json.load(op.open(req, timeout=10))
            except OSError as e:
                sys.exit("Deluge's web UI is still starting (%s)." % e)
            if reply.get("error"):
                sys.exit("Deluge said: %s" % reply["error"].get("message"))
            return reply["result"]
        new = os.environ["WEB_PASSWORD"]
        if call("auth.login", new):
            print("Deluge has its password already.")
        elif call("auth.login", "deluge"):
            call("auth.change_password", "deluge", new)
            print("Deluge's web UI has the password Roostack made.")
        else:
            sys.exit("Deluge's web UI refused both its default password and Roostack's.")
        hosts = call("web.get_hosts")
        if hosts:
            call("web.set_config", {"default_daemon": hosts[0][0]})
            call("web.connect", hosts[0][0])
            print("Its web UI will connect to its daemon by itself.")

routes:
  web:
    container: app
    port: 8112
    subdomain: deluge
    exposure: private
    public:
      login_paths:
        - /json

ports:
  peers:
    title: Peers (TCP)
    description: Lets other people's torrent clients connect to Deluge, which makes downloads faster. Deluge works without it.
    container: app
    port: 6881
    host_port: 6881
    enabled: false
  peers-udp:
    title: Peers (UDP)
    description: The same for UDP, and for finding peers through the DHT.
    container: app
    port: 6881
    protocol: udp
    host_port: 6881
    enabled: false
