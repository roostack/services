# Immich: several containers, its own Postgres image, Redis, optional
# machine learning, GPU, large media. Image digests looked up 2026-10-18;
# the database image is the one Immich 3.3.3's own compose file pins.
schema: roostack/v1alpha1
name: immich
title: Immich
description: Photo and video backup, a self-hosted alternative to Google Photos
version: 3.3.3-roostack.1

about:
  maker: a full-time team backed by FUTO
  website: https://immich.app
  source: https://github.com/immich-app/immich
  # Its licence notice names version 3 of the AGPL, without "or later".
  licence: AGPL-3.0-only
  support: https://buy.immich.app
  icon: icon.png
  categories: [photos]
  keywords: [photos, videos, phone backup, albums, face recognition, google photos alternative]
requires:
  roostack: "0.1"

settings:
  # The administrator, made by the install hook below, so Immich's first
  # sign-up (which makes the administrator) isn't left open for anyone.
  - key: admin_email
    title: Your email address
    description: For signing in to Immich as its administrator
    type: string
    required: true
    install_only: true
  - key: admin_password
    title: Your password
    description: At least 8 characters. Roostack forgets it once the account exists.
    type: secret
    min_length: 8
    install_only: true           # deleted once the install hook succeeds
  - key: machine_learning
    title: Smart search and face recognition
    description: Uses more CPU and RAM (~1-2 GB)
    type: bool
    default: true
  - key: hardware_acceleration
    title: Use GPU for video transcoding
    type: bool
    default: auto                # enabled if Roostack detects a supported GPU

containers:
  server:
    image: ghcr.io/immich-app/immich-server:v3.3.3@sha256:bae7664ff3aa4c2c1fcbdcdd86b40b105643c5f861f3e6a770fc760089f25862
    memory: 1.3 GB               # 1.29 GB in use, measured 2026-10-18; more while it imports
    env:
      DB_HOSTNAME: "{{ .Databases.main.Host }}"
      DB_USERNAME: "{{ .Databases.main.User }}"
      DB_DATABASE_NAME: "{{ .Databases.main.Name }}"
      REDIS_HOSTNAME: "{{ .Databases.cache.Host }}"
      IMMICH_MACHINE_LEARNING_ENABLED: "{{ .Settings.machine_learning }}"
      IMMICH_MACHINE_LEARNING_URL: 'http://{{ (index .Containers "machine-learning").Host }}:3003'
    secrets:
      DB_PASSWORD: databases.main.password   # created by Roostack
    mounts:
      - { storage: library, path: /data }
      - { storage: thumbs,  path: /data/thumbs }
      - { storage: encoded, path: /data/encoded-video }
    devices:
      - gpu: intel               # abstract; Roostack maps /dev/dri and groups
        when: "{{ .Settings.hardware_acceleration }}"
    health:
      http: { port: 2283, path: /api/server/ping }
    depends_on: [databases.main, databases.cache]

  machine-learning:
    when: "{{ .Settings.machine_learning }}"
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.3@sha256:73915f07e1f4289ba45b174c58443db74cef47ddf502613f475fc5e52458ea42
    memory: 1.5 GB               # once its models are loaded
    mounts:
      - { storage: model-cache, path: /cache }
    health:
      http: { port: 3003, path: /ping }

storage:
  library:
    title: Your photos and videos
    class: critical              # original photos and videos
    location: media              # the large data disk, if one is configured
  thumbs:
    title: Thumbnails
    class: replaceable           # regenerated by Immich
    location: media
  encoded:
    title: Converted videos
    class: replaceable           # transcoded videos, regenerated
    location: media
  model-cache:
    title: Smart search models
    class: replaceable           # ML models, downloaded again when needed

databases:
  main:
    type: postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    quadlet:                     # raw Quadlet passthrough
      Container:
        ShmSize: 128m
  cache:
    type: redis                  # the valkey image by default
    backup: false                # job queue only, safe to lose

hooks:
  # The administrator, through Immich's admin sign-up, which works only
  # while there's none. Safe to re-run: an existing administrator is kept.
  - on: install
    container: server
    env:
      ADMIN_EMAIL: "{{ .Settings.admin_email }}"
    secrets:
      ADMIN_PASSWORD: admin_password
    command:
      - node
      - -e
      - |
        const http = require('node:http')
        const body = JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD, name: process.env.ADMIN_EMAIL.split('@')[0] })
        const req = http.request({ host: '127.0.0.1', port: 2283, path: '/api/auth/admin-sign-up', method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) } }, (res) => {
          let data = ''
          res.on('data', (c) => { data += c })
          res.on('end', () => {
            let out = {}
            try { out = JSON.parse(data) } catch {}
            if (res.statusCode === 201) { console.log('The administrator is made.'); return }
            if (/already has an admin|admin setup is not available/i.test(String(out.message || ''))) { console.log('Immich already has an administrator.'); return }
            console.error('Making the administrator failed:', res.statusCode, String(out.message || '')); process.exit(1)
          })
        })
        req.on('error', (e) => { console.error('Immich is not answering yet:', e.message); process.exit(1) })
        req.end(body)

routes:
  web:
    container: server
    port: 2283
    subdomain: photos
    exposure: private
    max_body_size: 50GB          # large video uploads
    public:
      login_paths:
        - /api/auth/login
