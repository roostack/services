# Immich: several containers, its own Postgres image, Redis, optional
# machine learning, GPU, large media. Image digests looked up 2026-10-18;
# the database image is the one Immich 3.3.3's own compose file pins.
schema: roostack/v1alpha1
name: immich
title: Immich
description: Photo and video backup, a self-hosted alternative to Google Photos
version: 3.3.3-roostack.3

about:
  maker: a full-time team backed by FUTO
  website: https://immich.app
  source: https://github.com/immich-app/immich
  # Its licence notice names version 3 of the AGPL, without "or later".
  licence: AGPL-3.0-only
  support: https://buy.immich.app
  icon: icon.png
  categories: [photos]
  keywords: [photos, videos, phone backup, albums, face recognition, google photos alternative]
built_with: [node, python, ffmpeg, libvips]
requires:
  roostack: "0.1"

settings:
  # The administrator, made by the install hook below, so Immich's first
  # sign-up (which makes the administrator) isn't left open for anyone.
  - key: admin_email
    title: Your email address
    description: For signing in to Immich as its administrator
    type: string
    required: true
    install_only: true
  - key: admin_password
    title: Your password
    description: At least 8 characters. Roostack forgets it once the account exists.
    type: secret
    min_length: 8
    install_only: true           # deleted once the install hooks succeed
  # A key Immich makes at install, which can only read and change Immich's
  # settings: single sign-on's hook sets Immich's sign-in with it (Immich
  # takes it only through its API). Roostack keeps it like a password.
  - key: settings_key
    title: Roostack's key to Immich's settings
    description: Immich makes it at install, so Roostack can set up single sign-on. It can only read and change Immich's settings, and is never shown.
    type: secret
    from_hook: true
  - key: machine_learning
    title: Smart search and face recognition
    description: Uses more CPU and RAM (~1-2 GB)
    type: bool
    default: true
  - key: hardware_acceleration
    title: Use GPU for video transcoding
    type: bool
    default: auto                # enabled if Roostack detects a supported GPU

containers:
  server:
    image: ghcr.io/immich-app/immich-server:v3.3.3@sha256:bae7664ff3aa4c2c1fcbdcdd86b40b105643c5f861f3e6a770fc760089f25862
    memory: 1.3 GB               # 1.29 GB in use, measured 2026-10-18; more while it imports
    env:
      DB_HOSTNAME: "{{ .Databases.main.Host }}"
      DB_USERNAME: "{{ .Databases.main.User }}"
      DB_DATABASE_NAME: "{{ .Databases.main.Name }}"
      REDIS_HOSTNAME: "{{ .Databases.cache.Host }}"
      IMMICH_MACHINE_LEARNING_ENABLED: "{{ .Settings.machine_learning }}"
      IMMICH_MACHINE_LEARNING_URL: 'http://{{ (index .Containers "machine-learning").Host }}:3003'
    secrets:
      DB_PASSWORD: databases.main.password   # created by Roostack
    mounts:
      - { storage: library, path: /data }
      - { storage: thumbs,  path: /data/thumbs }
      - { storage: encoded, path: /data/encoded-video }
    devices:
      - gpu: intel               # abstract; Roostack maps /dev/dri and groups
        when: "{{ .Settings.hardware_acceleration }}"
    health:
      http: { port: 2283, path: /api/server/ping }
    depends_on: [databases.main, databases.cache]

  machine-learning:
    when: "{{ .Settings.machine_learning }}"
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.3@sha256:73915f07e1f4289ba45b174c58443db74cef47ddf502613f475fc5e52458ea42
    memory: 1.5 GB               # once its models are loaded
    mounts:
      - { storage: model-cache, path: /cache }
    health:
      http: { port: 3003, path: /ping }

storage:
  library:
    title: Your photos and videos
    class: critical              # original photos and videos
    location: media              # the large data disk, if one is configured
  thumbs:
    title: Thumbnails
    class: replaceable           # regenerated by Immich
    location: media
  encoded:
    title: Converted videos
    class: replaceable           # transcoded videos, regenerated
    location: media
  model-cache:
    title: Smart search models
    class: replaceable           # ML models, downloaded again when needed

databases:
  main:
    type: postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    quadlet:                     # raw Quadlet passthrough
      Container:
        ShmSize: 128m
  cache:
    type: redis                  # the valkey image by default
    backup: false                # job queue only, safe to lose

hooks:
  # The administrator, through Immich's admin sign-up, which works only
  # while there's none. Safe to re-run: an existing administrator is kept.
  - on: install
    container: server
    env:
      ADMIN_EMAIL: "{{ .Settings.admin_email }}"
    secrets:
      ADMIN_PASSWORD: admin_password
    command:
      - node
      - -e
      - |
        const http = require('node:http')
        const body = JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD, name: process.env.ADMIN_EMAIL.split('@')[0] })
        const req = http.request({ host: '127.0.0.1', port: 2283, path: '/api/auth/admin-sign-up', method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) } }, (res) => {
          let data = ''
          res.on('data', (c) => { data += c })
          res.on('end', () => {
            let out = {}
            try { out = JSON.parse(data) } catch {}
            if (res.statusCode === 201) { console.log('The administrator is made.'); return }
            if (/already has an admin|admin setup is not available/i.test(String(out.message || ''))) { console.log('Immich already has an administrator.'); return }
            console.error('Making the administrator failed:', res.statusCode, String(out.message || '')); process.exit(1)
          })
        })
        req.on('error', (e) => { console.error('Immich is not answering yet:', e.message); process.exit(1) })
        req.end(body)

  # A key for Roostack, which can only read and change Immich's settings
  # (for single sign-on). It prints the key, and only the key, on standard
  # output, which Roostack keeps as settings_key; everything else goes to
  # standard error, the log. An older key named Roostack is deleted first,
  # so Immich holds one. The Connect action below runs the same script.
  - on: install
    title: Make a key for Roostack
    container: server
    env:
      ADMIN_EMAIL: "{{ .Settings.admin_email }}"
    secrets:
      ADMIN_PASSWORD: admin_password
    saves: settings_key
    command: &make-key
      - node
      - -e
      - |
        const http = require('node:http')
        const call = (method, path, body, headers = {}) => new Promise((resolve, reject) => {
          const data = body === undefined ? '' : JSON.stringify(body)
          const req = http.request({ host: '127.0.0.1', port: 2283, path, method,
            headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data), ...headers } }, (res) => {
            let out = ''
            res.on('data', (c) => { out += c })
            res.on('end', () => { let json = null; try { json = JSON.parse(out) } catch {}; resolve({ status: res.statusCode, json }) })
          })
          req.on('error', reject)
          req.end(data)
        })
        const fail = (what, r) => { console.error(what, r.status, String((r.json && r.json.message) || '')); process.exit(1) }
        ;(async () => {
          const login = await call('POST', '/api/auth/login', { email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD })
          if (login.status !== 201 || !login.json || !login.json.accessToken) fail('Signing in as the administrator failed:', login)
          if (!login.json.isAdmin) { console.error(process.env.ADMIN_EMAIL + " isn't Immich's administrator."); process.exit(1) }
          const auth = { Authorization: 'Bearer ' + login.json.accessToken }
          const keys = await call('GET', '/api/api-keys', undefined, auth)
          for (const k of (keys.json || [])) {
            if (k.name === 'Roostack') await call('DELETE', '/api/api-keys/' + k.id, undefined, auth)
          }
          const made = await call('POST', '/api/api-keys', { name: 'Roostack', permissions: ['adminConfig.read', 'adminConfig.update'] }, auth)
          if (made.status !== 201 || !made.json || !made.json.secret) fail('Making the key failed:', made)
          await call('POST', '/api/auth/logout', undefined, auth)
          console.error("Made a key named Roostack, which can only read and change Immich's settings.")
          process.stdout.write(made.json.secret + '\n')
        })().catch((e) => { console.error('Immich is not answering yet:', e.message); process.exit(1) })

  # For an Immich installed before Roostack kept a key, or whose key is
  # gone (deleted in Immich, say): the Single sign-on card offers it.
  - on: action
    name: connect
    title: Connect Roostack to Immich
    description: Makes a key Roostack keeps, which can only read and change Immich's settings, so Roostack can set up single sign-on. Type Immich's administrator email and password once; Roostack keeps only the key.
    container: server
    inputs:
      - { key: email, title: Administrator email, type: string }
      - { key: password, title: Administrator password, type: secret }
    env:
      ADMIN_EMAIL: "{{ .Inputs.email }}"
    secrets:
      ADMIN_PASSWORD: inputs.password
    saves: settings_key
    command: *make-key

  # Single sign-on (SPEC.md §5.2): Immich keeps its sign-in settings in its
  # database, changed only through its API, all of them at once: read them,
  # change the OAuth part, write them back. Safe to run again. Off turns
  # Immich's OAuth off and forgets the secret; accounts it made keep their
  # photos, and their owners need a password (Immich's Administration).
  - on: sso
    title: Set Immich's sign-in
    container: server
    env:
      ISSUER: "{{ .SSO.Issuer }}"
      CLIENT_ID: "{{ .SSO.ClientID }}"
      BUTTON: "{{ .SSO.ButtonText }}"
    secrets:
      API_KEY: settings_key
      CLIENT_SECRET: sso.client_secret
    command:
      - node
      - -e
      - |
        const http = require('node:http')
        const call = (method, path, body) => new Promise((resolve, reject) => {
          const data = body === undefined ? '' : JSON.stringify(body)
          const req = http.request({ host: '127.0.0.1', port: 2283, path, method,
            headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(data), 'x-api-key': process.env.API_KEY } }, (res) => {
            let out = ''
            res.on('data', (c) => { out += c })
            res.on('end', () => { let json = null; try { json = JSON.parse(out) } catch {}; resolve({ status: res.statusCode, json }) })
          })
          req.on('error', reject)
          req.end(data)
        })
        const fail = (what, r) => { console.error(what, r.status, String((r.json && r.json.message) || '')); process.exit(1) }
        ;(async () => {
          const got = await call('GET', '/api/admin/config')
          if (got.status !== 200 || !got.json || !got.json.oauth) fail("Reading Immich's settings failed:", got)
          const config = got.json
          if (process.env.ROOSTACK_SSO === 'on') {
            Object.assign(config.oauth, { enabled: true, issuerUrl: process.env.ISSUER, clientId: process.env.CLIENT_ID,
              clientSecret: process.env.CLIENT_SECRET, scope: 'openid email profile groups', buttonText: process.env.BUTTON,
              autoRegister: true, autoLaunch: false, roleClaim: 'groups', signingAlgorithm: 'RS256',
              tokenEndpointAuthMethod: 'client_secret_post' })
          } else if (!config.oauth.enabled && !config.oauth.clientSecret) {
            console.log('Immich has no single sign-on to turn off.')
            return
          } else {
            Object.assign(config.oauth, { enabled: false, clientSecret: '' })
          }
          const put = await call('PUT', '/api/admin/config', config)
          if (put.status !== 200) fail("Changing Immich's settings failed:", put)
          console.log(process.env.ROOSTACK_SSO === 'on' ? "Immich's sign-in now uses the lab's sign-in page." : "Immich's single sign-on is off.")
        })().catch((e) => { console.error('Immich is not answering yet:', e.message); process.exit(1) })

routes:
  web:
    container: server
    port: 2283
    subdomain: photos
    exposure: private
    max_body_size: 50GB          # large video uploads
    public:
      login_paths:
        - /api/auth/login

# Single sign-on (SPEC.md §5.2): set through Immich's API by the sso hook
# above, with the key Roostack keeps. Immich links an account with the same
# email (its administrator, made at install) and makes the rest at first
# sign-in; "admin" in the groups claim makes someone Immich's admin.
sso:
  oidc:
    route: web
    redirect_paths: [/auth/login, /user-settings]
    redirect_uris: ["app.immich:///oauth-callback"]   # Immich's phone app
    groups: { users: user, admins: admin }
  note: Immich's phone app signs in with single sign-on too; API keys stay Immich's own.
