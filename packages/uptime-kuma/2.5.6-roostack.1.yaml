# Uptime Kuma: one container, SQLite. Image digest looked up 2026-10-18.
schema: roostack/v1alpha1
name: uptime-kuma
title: Uptime Kuma
description: Watches your websites and services, and tells you when one goes down
version: 2.5.6-roostack.1

about:
  maker: Louis Lam and contributors
  website: https://uptime.kuma.pet
  source: https://github.com/louislam/uptime-kuma
  licence: MIT
  support: https://opencollective.com/uptime-kuma
  # A placeholder, not Uptime Kuma's logo: the project states no terms
  # for using it. Replace before go-live (Roostack's TASKS).
  icon: icon.png
  categories: [network]
  keywords: [monitoring, uptime, status page, alerts, ping]
requires:
  roostack: "0.1"

settings:
  # The account, made by the install hook below. Until there's one,
  # Uptime Kuma lets whoever opens it first make it.
  - key: admin_username
    title: Your username
    type: string
    required: true
    install_only: true
  - key: admin_password
    title: Your password
    description: At least 8 characters, and not an easy one (Uptime Kuma refuses weak passwords). Roostack forgets it once the account exists.
    type: secret
    min_length: 8
    install_only: true           # deleted once the install hook succeeds

containers:
  app:
    # Runs as the container's root: Roostack's own user on the host.
    image: docker.io/louislam/uptime-kuma:2.5.6@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    env:
      UPTIME_KUMA_DB_TYPE: sqlite  # skips its page asking which database to use
    mounts:
      - { storage: data, path: /app/data }
    health:
      http: { port: 3001, path: /api/entry-page }
    memory: 150 MB               # 112 MB in use, measured 2026-10-18

storage:
  data:
    title: Your monitors, history and settings
    class: critical

databases:
  main:
    type: sqlite
    path: data/kuma.db

hooks:
  # The account, through Uptime Kuma's own first-run "setup" call over its
  # live connection (socket.io), which works only while there's none.
  # Values arrive as environment variables. Safe to re-run: once there's
  # an account, done.
  - on: install
    container: app
    env:
      ADMIN_USERNAME: "{{ .Settings.admin_username }}"
    secrets:
      ADMIN_PASSWORD: admin_password
    command:
      - node
      - -e
      - |
        const { io } = require('/app/node_modules/socket.io-client')
        const socket = io('http://127.0.0.1:3001', { transports: ['websocket'], reconnection: false, timeout: 10000 })
        const fail = (msg) => { console.error(msg); socket.close(); process.exit(1) }
        socket.on('connect_error', (e) => fail('Uptime Kuma is not answering yet: ' + e.message))
        socket.on('connect', () => {
          // Just after starting, it can accept the connection before it
          // answers calls: give up, and be retried, rather than wait forever.
          socket.timeout(15000).emit('setup', process.env.ADMIN_USERNAME, process.env.ADMIN_PASSWORD, (err, res) => {
            if (err) fail('Uptime Kuma is still starting: no answer yet.')
            if (res.ok) console.log('Your account is made.')
            else if (/has been initialized/.test(res.msg)) console.log('The account exists already.')
            else fail('Making the account failed: ' + res.msg)
            socket.close()
            process.exit(0)
          })
        })

routes:
  web:
    container: app
    port: 3001
    subdomain: status
    exposure: private
    public:
      unsafe: >-
        Signing in goes over Uptime Kuma's live connection (/socket.io) with
        everything else, so Roostack can't give it the strict rate limit login
        pages get; Uptime Kuma limits attempts itself (20 a minute). Status
        pages you share are safe to make public; the rest needs a strong password.
