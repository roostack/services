# Stirling-PDF: one container, no database. Image digest looked up
# 2026-10-18.
#
# Without accounts (the Owner's choice, 2026-10-18): since v3 Stirling-PDF's
# accounts and login are in its proprietary part, and before they were
# optional anyway. Anyone who can reach it can use it, so it stays
# private; with single sign-on on, it's behind the lab's sign-in (below).
schema: roostack/v1alpha1
name: stirling-pdf
title: Stirling-PDF
description: Merges, splits, converts, compresses and signs PDFs in your browser, without uploading them anywhere else
version: 3.2.2-roostack.1

about:
  maker: Stirling PDF Inc. and contributors
  website: https://www.stirlingpdf.com
  source: https://github.com/Stirling-Tools/Stirling-PDF
  licence: MIT                   # outside app/proprietary, whose features stay off here
  # The project's logo: where it came from, and its terms, are in registry.yaml.
  icon: icon.png
  categories: [documents]
  keywords: [pdf, merge, split, convert, compress, sign, ocr]
built_with: [java, spring, libreoffice, tesseract, python, ffmpeg]
requires:
  roostack: "0.1"

containers:
  app:
    # The image's start script runs as the container's root (Roostack's own
    # user on the host) and switches to its own user.
    image: docker.io/stirlingtools/stirling-pdf:3.2.2@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
    env:
      SECURITY_ENABLELOGIN: "false"
      SYSTEM_FILEUPLOADLIMIT: 100MB  # as the route allows
      SYSTEM_SHOWUPDATE: "false"  # Roostack offers updates
    mounts:
      - { storage: configs, path: /configs }
      - { storage: logs,    path: /logs }
    health:
      http: { port: 8080, path: /api/v1/info/status }
    memory: 1 GB                 # 953 MB in use, measured 2026-10-19 (Java)

storage:
  configs:
    title: Settings
    class: critical
  logs:
    title: Stirling-PDF's logs
    class: replaceable

routes:
  web:
    container: app
    port: 8080
    subdomain: pdf
    exposure: private
    max_body_size: 100MB
    public:
      unsafe: >-
        Stirling-PDF has no accounts here: anyone who reaches it can use it, and
        your server does the work. Keep it on your home network.

# Single sign-on (SPEC.md §5.2): with no accounts of its own, Stirling-PDF
# goes behind the wall, so only the people the Owner chooses reach it.
sso:
  forward_auth:
    route: web
  note: Scripts that use Stirling-PDF's API can't sign in, so they don't work while single sign-on is on.
