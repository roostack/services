# Builds the signed index from this repository and publishes it, with the
# package files, at https://registry.roostack.cloud/v1/ (GitHub Pages),
# where labs fetch it (Roostack's SPEC.md §8.3.3).
#
# Pull requests: every package is checked (roostack registry index -check:
# each package validated, the package policy applied, the image registries
# asked for each image's processors), and what each added or changed
# package generates is shown in the run's summary, with the difference
# from its previous version (.github/render-changes.sh); and each new
# version's images are scanned with Syft and compared with its built_with
# (.github/scan-boms.sh, roostack registry bom-check), in the summary too.
# Nothing is signed, published or committed: the Bills of materials
# workflow keeps the bills once merged.
# main, and every day: the same, signed with the signing key, and published.
# Not for a push that changes only watch/ or boms/ (the Watch and Bills of
# materials workflows' own commits), which the index doesn't use: with
# WATCH_TOKEN, the watcher's hourly commit would otherwise publish a new
# index every hour and send every linked lab to fetch it.
# The daily run signs a fresh index even with no changes, so a lab can tell
# an index that's merely unchanged from one it can't get any more (Roostack
# warns once its newest is over 14 days old).
#
# Set up (README.md, "Publishing"; Roostack's docs/REGISTRY-KEYS.md):
# - the environment "publish", usable only from main, holding the secret
#   REGISTRY_SIGNING_KEY (from roostack registry keygen), and an
#   environment "check" with no secrets, for pull requests;
# - keys/keys.json and keys/keys.json.sig, from roostack registry delegate;
# - the variables ROOSTACK_BINARY_URL and ROOSTACK_BINARY_SHA256: a
#   Roostack release's linux/amd64 roostack binary, which builds the index,
#   and its SHA-256 (so a changed download fails the run);
# - Pages: source "GitHub Actions", custom domain registry.roostack.cloud.
name: Publish

on:
  push:
    branches: [main]
    paths-ignore: ["watch/**", "boms/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The signing key is only in this environment, which only main can use.
    environment: ${{ github.event_name == 'pull_request' && 'check' || 'publish' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: services
          # All of it (it's small), so a pull request can be compared with
          # its base.
          fetch-depth: 0
      - name: Get roostack (a release, checked by its SHA-256)
        env:
          URL: ${{ vars.ROOSTACK_BINARY_URL }}
          SHA256: ${{ vars.ROOSTACK_BINARY_SHA256 }}
        run: |
          curl -fsSL --retry 3 -o roostack-bin "$URL"
          echo "$SHA256  roostack-bin" | sha256sum -c -
          chmod +x roostack-bin
      - name: Check the packages
        if: github.event_name == 'pull_request'
        run: ./roostack-bin registry index -check -repo services
      - name: Show what the changed packages generate
        if: github.event_name == 'pull_request'
        working-directory: services
        env:
          BASE: origin/${{ github.base_ref }}
        run: .github/render-changes.sh "$GITHUB_WORKSPACE/roostack-bin" "$BASE"
      - name: Get Syft (a release, checked by its SHA-256)
        if: github.event_name == 'pull_request'
        run: services/.github/get-syft.sh
      - name: Compare the new versions' images with their built_with
        if: github.event_name == 'pull_request'
        working-directory: services
        run: |
          scanned=$(.github/scan-boms.sh "$GITHUB_WORKSPACE/roostack-bin" "$GITHUB_WORKSPACE/syft-bin" | paste -sd, -)
          if [ -n "$scanned" ]; then
            "$GITHUB_WORKSPACE/roostack-bin" registry bom-check -repo . -only "$scanned" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the packages and build the signed index
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: ./roostack-bin registry index -repo services -out site/v1 -commit "$GITHUB_SHA"
      - name: Prepare the site
        if: github.event_name != 'pull_request'
        run: |
          echo registry.roostack.cloud > site/CNAME
          printf '<!doctype html><title>Roostack service registry</title><p>The <a href="https://github.com/roostack/services">Roostack service registry</a>. Roostack labs read <code>v1/index.json</code>.</p>\n' > site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
