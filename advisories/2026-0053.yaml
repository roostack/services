# Drafted on 2026-11-19 from GitHub's advisory for better-auth, found going through the digest of
# 2026-11-16 (roostack/services#150). Kan 0.7.0's image carries better-auth 1.4.6 (fixed in 1.7.7)
# and always turns on its Magic Link sign-in; with single sign-on on, Roostack also turns on its
# generic OAuth, which is the other condition. So a Kan with single sign-on on is affected; one
# without it isn't. Kan is private by default. Kan 0.7.0 is its newest release: none is fixed yet.
# Check every line before merging: the title (what it lets someone do), the
# severity in Roostack's meaning, and the versions (docs/RED-BUTTON-PLAN.md §10.1.3).
title: 'Kan: with single sign-on on, someone who can reach Kan can sign in as any of its people'
cves: [CVE-2026-110862, CVE-2026-114607]
severity: critical
exploited: false
published: "2026-11-19"
link: https://github.com/advisories/GHSA-965c-763c-88jm
affects:
    kan:
        versions: [0.7.0-roostack.1]
